name: CD Pipeline - Build & Release Android Split APKs

on:
  workflow_run:
    workflows: ["CI - Kairós Test Suite"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-tag:
    name: Calculate SemVer & Create Tag
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
      changelog: ${{ steps.tag_version.outputs.changelog }}

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0

      - name: Calculate SemVer & Create Git Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v
          release_branches: main,master
          fetch_all_tags: true
          custom_release_rules: "feat:minor:🚀 Novas Funcionalidades,fix:patch:🐛 Correções de Bugs,perf:patch:⚡ Melhorias de Performance,refactor:patch:♻️ Refatoração,docs:none:📚 Documentação,style:none:💄 Estilo de Código,chore:none:🔧 Tarefas e Manutenção,ci:none:🤖 CI/CD"

      - name: Check for New Tag
        id: check_tag
        run: |
          if [ -z "${{ steps.tag_version.outputs.new_tag }}" ]; then
            echo "Nenhuma tag nova gerada (commit sem incremento de versão ou ignorado pelas regras). O pipeline de compilação não será acionado."
          else
            echo "Nova tag gerada com sucesso: ${{ steps.tag_version.outputs.new_tag }} (versão: ${{ steps.tag_version.outputs.new_version }})"
          fi

  build-and-release-android:
    name: Build & Release Android Split APKs
    needs: check-and-tag
    if: ${{ needs.check-and-tag.outputs.new_tag != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Gradle Wrappers & Caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Inject Version into src/version.py and pyproject.toml
        run: |
          echo "Injetando versão calculada: ${{ needs.check-and-tag.outputs.new_version }}"
          python -c "
          import re
          v = '${{ needs.check-and-tag.outputs.new_version }}'
          with open('src/version.py', 'w', encoding='utf-8') as f:
              f.write(f'\"\"\"Módulo gerado automaticamente pelo pipeline de CD.\"\"\"\n\n__version__ = \"{v}\"\n')

          with open('pyproject.toml', 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r'version\s*=\s*\"[^\"]+\"', f'version = \"{v}\"', content, count=1)
          with open('pyproject.toml', 'w', encoding='utf-8') as f:
              f.write(content)
          "
          echo "Conteúdo de src/version.py:"
          cat src/version.py
          echo "Versão em pyproject.toml:"
          grep -m 1 "^version =" pyproject.toml

      - name: Install Python Runtime Dependencies
        run: |
          pip install --only-binary :all: -r requirements.txt

      - name: Clean Temporary Asset Files
        run: |
          rm -f assets/*.db-wal assets/*.db-shm src/database/data/*.db-wal src/database/data/*.db-shm

      - name: Generate Environment File from Secrets (.env)
        env:
          AUTH_SUPABASE_URL: ${{ secrets.AUTH_SUPABASE_URL || secrets.DEVOTIONAL_SUPABASE_URL || secrets.SUPABASE_URL }}
          AUTH_SUPABASE_ANON_KEY: ${{ secrets.AUTH_SUPABASE_ANON_KEY || secrets.DEVOTIONAL_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          AUTH_REDIRECT_URI: ${{ secrets.AUTH_REDIRECT_URI || 'nhaapp://login-callback' }}
          DEVOTIONAL_SUPABASE_URL: ${{ secrets.DEVOTIONAL_SUPABASE_URL || secrets.SUPABASE_URL }}
          DEVOTIONAL_SUPABASE_ANON_KEY: ${{ secrets.DEVOTIONAL_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          # Fallbacks para compatibilidade
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.DEVOTIONAL_SUPABASE_URL || secrets.AUTH_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.DEVOTIONAL_SUPABASE_ANON_KEY || secrets.AUTH_SUPABASE_ANON_KEY }}
        run: |
          echo "Injetando credenciais do Supabase no ambiente de build..."
          cat <<EOF > .env
          AUTH_SUPABASE_URL=$AUTH_SUPABASE_URL
          AUTH_SUPABASE_ANON_KEY=$AUTH_SUPABASE_ANON_KEY
          AUTH_REDIRECT_URI=$AUTH_REDIRECT_URI
          DEVOTIONAL_SUPABASE_URL=$DEVOTIONAL_SUPABASE_URL
          DEVOTIONAL_SUPABASE_ANON_KEY=$DEVOTIONAL_SUPABASE_ANON_KEY
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF
          cp .env assets/.env 2>/dev/null || true
          echo "Arquivo .env gerado com sucesso para o pacote do aplicativo."
          echo "Status das credenciais no build:"
          [ -n "$AUTH_SUPABASE_URL" ] && echo "  AUTH_SUPABASE_URL: Definida" || echo "  AUTH_SUPABASE_URL: AUSENTE"
          [ -n "$AUTH_SUPABASE_ANON_KEY" ] && echo "  AUTH_SUPABASE_ANON_KEY: Definida" || echo "  AUTH_SUPABASE_ANON_KEY: AUSENTE"
          [ -n "$DEVOTIONAL_SUPABASE_URL" ] && echo "  DEVOTIONAL_SUPABASE_URL: Definida" || echo "  DEVOTIONAL_SUPABASE_URL: AUSENTE"
          [ -n "$DEVOTIONAL_SUPABASE_ANON_KEY" ] && echo "  DEVOTIONAL_SUPABASE_ANON_KEY: Definida" || echo "  DEVOTIONAL_SUPABASE_ANON_KEY: AUSENTE"

      - name: Prepare Python Database Assets for App Bundle
        run: |
          flet build apk --build-version "${{ needs.check-and-tag.outputs.new_version }}" --build-number ${{ github.run_number }} --split-per-abi -v

      - name: Organize and Rename Split APKs
        id: organize_apks
        run: |
          mkdir -p release_apks
          TAG="${{ needs.check-and-tag.outputs.new_tag }}"
          VERSION="${{ needs.check-and-tag.outputs.new_version }}"

          echo "APKs brutos encontrados em build/apk:"
          ls -la build/apk/

          # Mapeamento do APK ARM64 (64-bit moderno)
          ARM64_APK=$(find build/apk -name "*arm64-v8a*.apk" | head -n 1)
          if [ -n "$ARM64_APK" ]; then
            cp "$ARM64_APK" "release_apks/Kairos_${VERSION}_arm64.apk"
            echo "Criado: Kairos_${VERSION}_arm64.apk"
          fi

          # Mapeamento do APK ARMv7 (32-bit legados)
          ARMV7_APK=$(find build/apk -name "*armeabi-v7a*.apk" | head -n 1)
          if [ -n "$ARMV7_APK" ]; then
            cp "$ARMV7_APK" "release_apks/Kairos_${VERSION}_armv7.apk"
            echo "Criado: Kairos_${VERSION}_armv7.apk"
          fi

          # Mapeamento do APK para Emuladores / x86_64
          X86_64_APK=$(find build/apk -name "*x86_64*.apk" | head -n 1)
          if [ -n "$X86_64_APK" ]; then
            cp "$X86_64_APK" "release_apks/Kairos_${VERSION}_x86_64.apk"
            echo "Criado: Kairos_${VERSION}_x86_64.apk"
          fi

          # Fallback de segurança se os nomes variarem
          if [ -z "$(ls -A release_apks)" ]; then
            echo "Fallback: Copiando todos os APKs encontrados..."
            for f in $(find build/apk -name "*.apk"); do
              BASE=$(basename "$f")
              cp "$f" "release_apks/Kairos_${VERSION}_${BASE}"
            done
          fi

          echo "Arquivos finais preparados para alinhamento e assinatura:"
          ls -la release_apks/

      - name: Align and Sign APKs with Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          trap 'rm -f release.jks' EXIT ERR

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          echo "Usando Android Build Tools: $BUILD_TOOLS"

          for apk in release_apks/*.apk; do
            echo "----------------------------------------"
            echo "1. Alinhando APK com zipalign (4-byte alignment): $apk"
            "$BUILD_TOOLS/zipalign" -p -f -v 4 "$apk" "${apk}.aligned"
            mv "${apk}.aligned" "$apk"

            echo "Verificando alinhamento de $apk:"
            "$BUILD_TOOLS/zipalign" -c -v 4 "$apk"

            echo "2. Assinando APK alinhado com apksigner: $apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks release.jks \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
              --key-pass pass:"$ANDROID_KEY_PASSWORD" \
              "$apk"

            echo "3. Verificando assinatura de $apk:"
            "$BUILD_TOOLS/apksigner" verify --verbose "$apk"
          done

          rm -f release.jks
          trap - EXIT ERR
          echo "Todos os APKs foram alinhados e assinados com sucesso!"

      - name: Secure Cleanup of Keystore
        if: always()
        run: |
          rm -f release.jks

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: Kairos_APKs_${{ needs.check-and-tag.outputs.new_tag }}
          path: release_apks/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ needs.check-and-tag.outputs.new_tag }}
          name: Kairós ${{ needs.check-and-tag.outputs.new_tag }}
          body: |
            ${{ needs.check-and-tag.outputs.changelog }}

            ---
            ### 📱 Downloads do Aplicativo Kairós
            * **ARM64 (Smartphones Modernos - 64 bits)**: `Kairos_${{ needs.check-and-tag.outputs.new_version }}_arm64.apk`
            * **ARMv7 (Aparelhos Legados - 32 bits)**: `Kairos_${{ needs.check-and-tag.outputs.new_version }}_armv7.apk`
            * **x86_64 (Emuladores e PCs - 64 bits)**: `Kairos_${{ needs.check-and-tag.outputs.new_version }}_x86_64.apk`
          files: release_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}