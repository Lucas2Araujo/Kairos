name: CD Pipeline - Build & Release Android Split APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão manual (ex: 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release-android:
    name: Build & Release Android Split APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Version
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v$VERSION"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="1.0.${{ github.run_number }}"
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Versão: $VERSION (Tag: $TAG, Build: ${{ github.run_number }})"

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Split APKs
        run: |
          flutter build apk \
            --split-per-abi \
            --build-name="${{ steps.version_step.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      - name: Organize APKs
        id: organize_apks
        run: |
          mkdir -p release_apks
          VERSION="${{ steps.version_step.outputs.version }}"
          
          find build/app/outputs/flutter-apk -name "*arm64-v8a*.apk" -exec cp {} "release_apks/Kairos_${VERSION}_arm64.apk" \;
          find build/app/outputs/flutter-apk -name "*armeabi-v7a*.apk" -exec cp {} "release_apks/Kairos_${VERSION}_armv7.apk" \;
          find build/app/outputs/flutter-apk -name "*x86_64*.apk" -exec cp {} "release_apks/Kairos_${VERSION}_x86_64.apk" \;

          echo "APKs organizados:"
          ls -lh release_apks/

      - name: Sign APKs
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          trap 'rm -f release.jks' EXIT ERR
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          for apk in release_apks/*.apk; do
            [ -f "$apk" ] || continue
            "$BUILD_TOOLS/zipalign" -p -f -v 4 "$apk" "${apk}.aligned"
            mv "${apk}.aligned" "$apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks release.jks \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
              --key-pass pass:"$ANDROID_KEY_PASSWORD" \
              "$apk"
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kairos_APKs_${{ steps.version_step.outputs.tag }}
          path: release_apks/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: Kairós ${{ steps.version_step.outputs.tag }}
          files: release_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
