name: Ingestão Diária de Devocionais

on:
  schedule:
    # Roda diariamente às 06:00 UTC (03:00 da manhã no horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite disparar o botão manual no painel do GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4 supabase

      - name: Executar script de sincronização
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/meditacao.py
