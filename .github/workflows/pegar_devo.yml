name: Ingestão Diária de Devocionais

on:
  schedule:
    # Roda diariamente às 03:30 UTC (00:30 no horário de Brasília)
    - cron: '30 3 * * *'
  workflow_dispatch: # Permite disparar o botão manual no painel do GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests beautifulsoup4 supabase; fi

      - name: Executar script de sincronização
        env:
          DEVOTIONAL_SUPABASE_URL: ${{ secrets.DEVOTIONAL_SUPABASE_URL || secrets.SUPABASE_URL }}
          DEVOTIONAL_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEVOTIONAL_SUPABASE_SERVICE_ROLE_KEY || secrets.DEVOTIONAL_SUPABASE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.LOGIN_SERVICE_KEY_SUPABASE }}
          SUPABASE_URL: ${{ secrets.DEVOTIONAL_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEVOTIONAL_SUPABASE_SERVICE_ROLE_KEY || secrets.DEVOTIONAL_SUPABASE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.LOGIN_SERVICE_KEY_SUPABASE }}
        run: |
          python scripts/meditacao.py
