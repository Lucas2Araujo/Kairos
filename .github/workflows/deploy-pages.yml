name: Deploy Kairós Web to GitHub Pages

on:
  workflow_run:
    workflows: ["CI - Kairós Test Suite"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Clean Temporary Asset Files and Prepare Databases
        run: |
          rm -f assets/*-wal assets/*-shm
          python3 -c "
          import sqlite3, glob
          for db in glob.glob('assets/*.sqlite') + glob.glob('assets/*.db'):
              try:
                  c = sqlite3.connect(db)
                  c.execute('PRAGMA journal_mode = DELETE;')
                  c.close()
              except: pass
          "
          rm -f assets/*-wal assets/*-shm

      - name: Generate Environment File from Secrets (.env)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Injetando credenciais do Supabase no ambiente de build web..."
          cat <<EOF > .env
          AUTH_SUPABASE_URL=$SUPABASE_URL
          AUTH_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          DEVOTIONAL_SUPABASE_URL=$SUPABASE_URL
          DEVOTIONAL_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF
          cp .env assets/.env 2>/dev/null || true

      - name: Build Flutter Web (Kairos)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --base-href "/${{ github.event.repository.name }}/"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
