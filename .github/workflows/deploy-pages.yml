name: Deploy Kairós Web to GitHub Pages

on:
  workflow_run:
    workflows: ["CI - Kairós Test Suite"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: '3.44.8'
          cache: true

      - name: Clean Temporary Asset Files and Sync Databases
        run: |
          mkdir -p src/database/data assets kairos_web/assets
          rm -f assets/*.db-wal assets/*.db-shm assets/*.sqlite-wal assets/*.sqlite-shm
          rm -f kairos_web/assets/*-wal kairos_web/assets/*-shm
          # Garante que os bancos estão disponíveis no kairos_web/assets
          [ -f assets/modules/ARA.sqlite ] && cp -u assets/modules/ARA.sqlite kairos_web/assets/ARA.sqlite 2>/dev/null || true
          [ -f assets/ARA.sqlite ] && cp -u assets/ARA.sqlite kairos_web/assets/ARA.sqlite 2>/dev/null || true
          [ -f assets/hinario.db ] && cp -u assets/hinario.db kairos_web/assets/hinario.db 2>/dev/null || true
          [ -f assets/hinario_antigo.db ] && cp -u assets/hinario_antigo.db kairos_web/assets/hinario_antigo.db 2>/dev/null || true
          [ -f src/database/data/hinario_comparativo.db ] && cp -u src/database/data/hinario_comparativo.db kairos_web/assets/hinario_comparativo.db 2>/dev/null || true
          [ -f assets/pericopes.sqlite ] && cp -u assets/pericopes.sqlite kairos_web/assets/pericopes.sqlite 2>/dev/null || true
          [ -f assets/cross_references.sqlite ] && cp -u assets/cross_references.sqlite kairos_web/assets/cross_references.sqlite 2>/dev/null || true
          [ -f assets/commentaries.sqlite ] && cp -u assets/commentaries.sqlite kairos_web/assets/commentaries.sqlite 2>/dev/null || true
          [ -d assets/fonts ] && cp -ru assets/fonts kairos_web/assets/ 2>/dev/null || true
          python3 -c "
          import sqlite3, glob
          for db in glob.glob('kairos_web/assets/*.sqlite') + glob.glob('kairos_web/assets/*.db'):
              try:
                  c = sqlite3.connect(db)
                  c.execute('PRAGMA journal_mode = DELETE;')
                  c.close()
              except: pass
          "
          [ -f src/database/data/hinario.db ] && cp -u src/database/data/hinario.db assets/hinario.db 2>/dev/null || true
          [ -f src/database/data/hinario_antigo.db ] && cp -u src/database/data/hinario_antigo.db assets/hinario_antigo.db 2>/dev/null || true
          [ -f src/database/data/ARA.sqlite ] && cp -u src/database/data/ARA.sqlite assets/ARA.sqlite 2>/dev/null || true
          [ -f assets/hinario.db ] && cp -u assets/hinario.db src/database/data/hinario.db 2>/dev/null || true
          [ -f assets/hinario_antigo.db ] && cp -u assets/hinario_antigo.db src/database/data/hinario_antigo.db 2>/dev/null || true
          [ -f assets/ARA.sqlite ] && cp -u assets/ARA.sqlite src/database/data/ARA.sqlite 2>/dev/null || true
          # Garante manifest.json nos assets
          [ -f manifest.json ] && cp -u manifest.json assets/manifest.json 2>/dev/null || true
          # Remove arquivos temporários de lock se existirem
          rm -f assets/*-wal assets/*-shm src/database/data/*-wal src/database/data/*-shm

      - name: Generate Environment File from Secrets (.env)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Injetando credenciais do Supabase no ambiente de build web..."
          cat <<EOF > .env
          AUTH_SUPABASE_URL=$SUPABASE_URL
          AUTH_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          DEVOTIONAL_SUPABASE_URL=$SUPABASE_URL
          DEVOTIONAL_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF
          cp .env assets/.env 2>/dev/null || true
          cp .env kairos_web/assets/.env 2>/dev/null || true

      - name: Build Flutter Web (Kairos)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cd kairos_web
          flutter pub get
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --base-href "/${{ github.event.repository.name }}/"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: kairos_web/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
