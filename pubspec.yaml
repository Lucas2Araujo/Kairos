name: kairos_web
description: "Kairós - Leitor Bíblico, Hinário e Escola Sabatina para Web"
publish_to: 'none'
version: 0.7.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  sqlite3: ^2.4.5
  path: ^1.9.0
  http: ^1.6.0
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.5.24
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  google_sign_in: ^6.2.2
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/ARA.sqlite
    - assets/commentaries.sqlite
    - assets/cross_references.sqlite
    - assets/pericopes.sqlite
    - assets/hinario.db
    - assets/hinario_antigo.db
    - assets/hinario_comparativo.db
    - assets/manifest.json
    - assets/cache/escola_sabatina/images/

  fonts:
    - family: AppSans
      fonts:
        - asset: assets/fonts/AppSans-Regular.ttf
        - asset: assets/fonts/AppSans-SemiBold.ttf
          weight: 600
    - family: HymnSerif
      fonts:
        - asset: assets/fonts/HymnSerif-Regular.ttf
        - asset: assets/fonts/HymnSerif-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
