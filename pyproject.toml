[project]
name = "Kairós"
version = "0.6.31"
description = "Kairós — Tempo de qualidade com Deus. App cristão multiplataforma com hinários, bíblia, meditação diária e agente litúrgico"

[tool.flet]
desktop_flavor = "light"

[tool.flet.app]
assets_dir = "assets"
icon = "icon.ico"

[tool.flet.android]
dependencies = [
    "pyjnius",
    "flet-audio==1.0.3",
    "aiosqlite==0.22.1",
    "httpx>=0.27.0",
    "anyio>=4.0.0,<4.14.0",
    "yt-dlp==2026.7.4",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "Pillow>=10.0.0",
]
permissions = [
    "android.permission.INTERNET",
    "android.permission.ACCESS_NETWORK_STATE",
    "android.permission.REQUEST_INSTALL_PACKAGES",
    "android.permission.READ_EXTERNAL_STORAGE",
    "android.permission.WRITE_EXTERNAL_STORAGE",
    "android.permission.WAKE_LOCK",
    "android.permission.FOREGROUND_SERVICE",
    "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
]

[tool.flet.android.deep_linking]
scheme = "nhaapp"
host = "login-callback"

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"


